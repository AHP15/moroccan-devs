<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MoroccanDevs">
  <title>MoroccanDevs</title>
  <!--
    Zellij eight-point star (khatam), the Moroccan tile motif, with an angle bracket
    knocked out of it. The bracket points left because the site reads right-to-left:
    in Arabic that is the "forward" direction.

    The star is stroked in its own fill colour so the sixteen corners come out softened
    rather than needle-sharp; that is what keeps the points from disappearing at 16px.
  -->
  <style>
    .star { fill: #6169ee; stroke: #6169ee }
    @media (prefers-color-scheme: dark) { .star { fill: #8b93ff; stroke: #8b93ff } }
  </style>
  <path class="star" stroke-width="2" stroke-linejoin="round"
    d="M30.2 16 26.041 20.159 26.041 26.041 20.159 26.041 16 30.2 11.841 26.041 5.959 26.041 5.959 20.159 1.8 16 5.959 11.841 5.959 5.959 11.841 5.959 16 1.8 20.159 5.959 26.041 5.959 26.041 11.841Z"/>
  <path d="M18.4 10.9 11.8 16 18.4 21.1" fill="none" stroke="#fff" stroke-width="3.4"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
